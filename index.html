<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — a calm to‑do list</title>
<meta name="description" content="A modern, minimal to-do list app with priorities, due dates, filtering, and offline storage." />

<!-- Fonts: Fraunces for character, Inter for interface text, JetBrains Mono for numbers/dates -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Skip link for keyboard/screen reader users -->
<a class="skip-link" href="#main-content">Skip to task list</a>

<div class="app-shell">

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <div class="brand-text">
        <h1>Ledger</h1>
        <p class="brand-sub">a calm place for your tasks</p>
      </div>
    </div>

    <div class="header-controls">
      <div class="theme-swatches" role="group" aria-label="Accent color theme">
        <button type="button" class="swatch swatch--denim is-active" data-accent="denim" aria-label="Denim accent theme" aria-pressed="true"></button>
        <button type="button" class="swatch swatch--sage" data-accent="sage" aria-label="Sage accent theme" aria-pressed="false"></button>
        <button type="button" class="swatch swatch--plum" data-accent="plum" aria-label="Plum accent theme" aria-pressed="false"></button>
      </div>

      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch to dark mode" aria-pressed="false" title="Toggle dark / light mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>

      <button type="button" id="export-btn" class="icon-btn" aria-label="Export tasks as PDF" title="Export tasks as PDF">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </button>
      <button type="button" id="import-btn" class="icon-btn" aria-label="Import tasks from JSON" title="Import tasks">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 7V4a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v3"/></svg>
      </button>
      <input type="file" id="import-input" accept="application/json" hidden />
    </div>
  </header>

  <div class="app-body">

    <!-- ============ SIDEBAR: stats + filters ============ -->
    <aside class="sidebar" aria-label="Task statistics and filters">

      <section class="stats-card" aria-label="Statistics dashboard">
        <h2 class="section-title">Overview</h2>
        <div class="stats-grid">
          <div class="stat">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-active">0</span>
            <span class="stat-label">Active</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="stat-completed">0</span>
            <span class="stat-label">Done</span>
          </div>
          <div class="stat stat--warn">
            <span class="stat-value" id="stat-overdue">0</span>
            <span class="stat-label">Overdue</span>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-label">
            <span>Completion</span>
            <span id="stat-percent" class="mono">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Completion progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </section>

      <section class="filters-card" aria-label="Filter and sort tasks">
        <h2 class="section-title">Filter</h2>

        <div class="tab-group" role="tablist" aria-label="Task status">
          <button class="tab is-active" role="tab" aria-selected="true" data-status="all">All</button>
          <button class="tab" role="tab" aria-selected="false" data-status="active">Active</button>
          <button class="tab" role="tab" aria-selected="false" data-status="completed">Completed</button>
        </div>

        <label class="field-label" for="filter-priority">Priority</label>
        <select id="filter-priority" class="select">
          <option value="all">Any priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <label class="field-label" for="filter-category">Category</label>
        <select id="filter-category" class="select">
          <option value="all">Any category</option>
        </select>

        <label class="field-label" for="filter-due">Due</label>
        <select id="filter-due" class="select">
          <option value="all">Any time</option>
          <option value="today">Due today</option>
          <option value="overdue">Overdue</option>
        </select>

        <label class="field-label" for="sort-by">Sort by</label>
        <select id="sort-by" class="select">
          <option value="manual">Manual order</option>
          <option value="createdDesc">Newest first</option>
          <option value="createdAsc">Oldest first</option>
          <option value="due">Due date</option>
          <option value="alpha">Alphabetical</option>
          <option value="priority">Priority</option>
        </select>

        <button type="button" id="reset-filters" class="text-btn">Reset filters</button>
      </section>

      <section class="danger-zone" aria-label="Bulk actions">
        <h2 class="section-title">Bulk actions</h2>
        <button type="button" id="clear-completed-btn" class="ghost-btn">Clear completed</button>
        <button type="button" id="delete-all-btn" class="ghost-btn ghost-btn--danger">Delete all tasks</button>
      </section>
    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main id="main-content" class="main-content">

      <!-- Add task form -->
      <section class="add-task-card" aria-label="Add a new task">
        <form id="task-form" novalidate>
          <div class="add-row">
            <input
              type="text"
              id="task-title"
              class="title-input"
              placeholder="What needs doing? (Enter to add)"
              maxlength="120"
              required
              aria-label="Task title"
              autocomplete="off"
            />
            <button type="submit" class="primary-btn" id="submit-btn">
              <span>Add task</span>
            </button>
          </div>

          <button type="button" id="toggle-details" class="text-btn details-toggle" aria-expanded="false" aria-controls="task-details">
            + Add details (description, due date, priority, category)
          </button>

          <div class="add-details" id="task-details" hidden>
            <div class="detail-grid">
              <div class="field">
                <label for="task-description">Description</label>
                <textarea id="task-description" rows="2" maxlength="500" placeholder="Optional notes…"></textarea>
              </div>
              <div class="field">
                <label for="task-due">Due date</label>
                <input type="date" id="task-due" />
              </div>
              <div class="field">
                <label for="task-priority">Priority</label>
                <select id="task-priority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="field">
                <label for="task-category">Category</label>
                <input type="text" id="task-category" list="category-list" maxlength="40" placeholder="e.g. Work" />
                <datalist id="category-list"></datalist>
              </div>
            </div>
          </div>
          <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
        </form>
      </section>

      <!-- Search -->
      <div class="search-row">
        <svg class="icon icon-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="search-input" placeholder="Search tasks by keyword…" aria-label="Search tasks" />
        <span class="result-count" id="result-count"></span>
      </div>

      <!-- Task list -->
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title">Nothing here.</p>
        <p class="empty-sub" id="empty-sub">Add your first task above to get started.</p>
      </div>

    </main>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- Confirm modal -->
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-body"></p>
    <div class="modal-actions">
      <button type="button" class="ghost-btn" id="confirm-cancel">Cancel</button>
      <button type="button" class="primary-btn primary-btn--danger" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<!-- Task card template -->
<template id="task-template">
  <li class="task-card" draggable="false">
    <div class="drag-handle" aria-hidden="true" title="Drag to reorder">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>
    </div>

    <button type="button" class="check-btn" role="checkbox" aria-checked="false" aria-label="Mark task complete">
      <svg class="check-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
    </button>

    <div class="task-body">
      <div class="task-view">
        <div class="task-top-row">
          <span class="priority-pill" data-priority-pill></span>
          <h3 class="task-title" data-title></h3>
          <button type="button" class="pin-btn" data-pin-btn aria-label="Pin task" title="Pin to top">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 5.6L19 9l-4 3.6.9 6.4-3.9-3.2-3.9 3.2.9-6.4L5 9l5.2-1.4z"/></svg>
          </button>
        </div>
        <p class="task-desc" data-description hidden></p>
        <div class="task-meta">
          <span class="meta-chip meta-due" data-due hidden></span>
          <span class="meta-chip meta-category" data-category hidden></span>
          <span class="meta-chip meta-created" data-created></span>
        </div>
      </div>

      <form class="task-edit" data-edit-form hidden novalidate>
        <input type="text" class="edit-title" data-edit-title maxlength="120" required aria-label="Edit title" />
        <textarea class="edit-desc" data-edit-desc rows="2" maxlength="500" placeholder="Description…" aria-label="Edit description"></textarea>
        <div class="edit-grid">
          <input type="date" data-edit-due aria-label="Edit due date" />
          <select data-edit-priority aria-label="Edit priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
          <input type="text" data-edit-category list="category-list" placeholder="Category" aria-label="Edit category" />
        </div>
        <div class="edit-actions">
          <span class="autosave-hint" data-autosave-hint>Saved</span>
          <button type="button" class="text-btn" data-cancel-edit>Cancel (Esc)</button>
          <button type="submit" class="primary-btn primary-btn--small" data-save-edit>Save</button>
        </div>
      </form>
    </div>

    <div class="task-actions">
      <button type="button" class="icon-btn icon-btn--small" data-edit-btn aria-label="Edit task" title="Edit">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--small" data-duplicate-btn aria-label="Duplicate task" title="Duplicate">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button type="button" class="icon-btn icon-btn--small icon-btn--danger" data-delete-btn aria-label="Delete task" title="Delete">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6h12z"/></svg>
      </button>
    </div>
  </li>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
